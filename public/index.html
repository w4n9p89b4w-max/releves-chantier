<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Relevés">
<meta name="theme-color" content="#1d5ca8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}</style>
<title>Relevés Chantier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : liste des chantiers à gauche, une seule page par chantier à droite (client → dessin → photos & fichiers → remarques → mesures) */
:root{
  --bg:#e9edef; --surface:#ffffff; --surface-2:#f4f6f7; --ink:#1a2226; --muted:#5a6870; --line:#d0d8dc;
  --accent:#1d5ca8; --accent-soft:#dfe9f5; --accent-ink:#ffffff; --tape:#f2b705; --tape-ink:#2a2200;
  --danger:#b3261e; --ok:#2c7a4b; --warn:#a86a00;
  --f-display:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --f-body:'Barlow',-apple-system,'Segoe UI',system-ui,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161a; --surface:#192126; --surface-2:#141b1f; --ink:#e4eaed; --muted:#93a2aa; --line:#2b363c;
  --accent:#6ea6ea; --accent-soft:#1d2d40; --accent-ink:#0c1520; --tape:#f5c63a; --tape-ink:#231c00;
  --danger:#ef7b72; --ok:#6cc893; --warn:#e6a945; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161a; --surface:#192126; --surface-2:#141b1f; --ink:#e4eaed; --muted:#93a2aa; --line:#2b363c;
  --accent:#6ea6ea; --accent-soft:#1d2d40; --accent-ink:#0c1520; --tape:#f5c63a; --tape-ink:#231c00;
  --danger:#ef7b72; --ok:#6cc893; --warn:#e6a945; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

#app{display:grid;grid-template-columns:340px minmax(0,1fr);height:100%}
.syncbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.syncdot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.syncdot.ok{background:var(--ok)} .syncdot.wait{background:var(--warn)} .syncdot.err{background:var(--danger)}
.viewbanner{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:10px}
body.viewer #newBtn, body.viewer .tb, body.viewer .sheetbar .btn, body.viewer .drop, body.viewer [data-del], body.viewer [data-annot],
body.viewer #delChantier, body.viewer .quick, body.viewer [data-addpan], body.viewer [data-delpan], body.viewer #geoBtn,
body.viewer .strip .add, body.viewer .ck:has(input:not(:checked)), body.viewer #restoreLbl, body.viewer #exportAll, body.viewer .typepick label:has(input:not(:checked)){display:none!important}
body.viewer #cv{pointer-events:none}
body.viewer .f input[readonly], body.viewer .f textarea[readonly], body.viewer .pans input[readonly]{background:transparent;border-color:transparent;padding-left:0}
#settings{position:fixed;inset:0;z-index:58;background:rgba(10,15,18,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#settings .box{background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#settings h3{font-size:26px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roles label{border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.roles label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.roles input{position:absolute;opacity:0}
.roles b{font-size:16px}
.roles span{font-size:13px;color:var(--muted)}
.foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.pane{display:flex;flex-direction:column;min-height:0;flex:1}
#clientPane{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;gap:12px}
#clientPane .card{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > *, .cp-ville > *{min-width:0}
.f input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left}
.f input[type=date]::-webkit-date-and-time-value{text-align:left}
.f input[data-pad]{cursor:pointer}
.f input.padfocus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
#numpad{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:56;width:min(340px,calc(100% - 24px));
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.3);padding:14px;display:flex;flex-direction:column;gap:10px}
#numpad .np-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#numpad .np-lbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
#numpad .np-val{font:500 28px var(--f-num);min-height:44px;padding:4px 12px;border:2px solid var(--accent);border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:flex-end;gap:6px;overflow:hidden;white-space:nowrap}
#numpad .np-val small{font-size:15px;color:var(--muted)}
#numpad .pad button:disabled{visibility:hidden}
#clientPane .contact .btn{flex:1 1 auto}
#side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--surface-2);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
#main{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-left:max(16px,2.5vw);padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
.page{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.brand{display:flex;align-items:center;gap:10px;padding-block:18px 12px}
.brand svg{flex:none}
.brand h1{font-size:26px;line-height:1}
.brand small{display:block;font:500 12px var(--f-body);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:46px}
.list{flex:1;overflow-y:auto;margin:12px -6px 0;padding:0 6px 12px;display:flex;flex-direction:column;gap:6px}
.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:12px;min-height:64px}
.item:hover{background:var(--surface)}
.item[aria-current="true"]{background:var(--surface);border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.item b{display:block;font-weight:600}
.item .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:3px}
.sidefoot{border-top:1px solid var(--line);padding-block:10px 14px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.sidefoot .row{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent}
.btn:active{transform:translateY(1px)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.st-chiffrer{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chip.st-devis{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.chip.st-signe{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.chip.st-perdu{opacity:.7}
.chip.ex{background:var(--tape);color:var(--tape-ink);border-color:transparent}

.head{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:16px 10px;margin-bottom:-6px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.head h2{font-size:clamp(26px,3.6vw,36px);line-height:1.05}
.head .left{display:flex;gap:10px;align-items:center;min-width:0;flex-wrap:wrap}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}
.back{display:none}
.jump{display:flex;gap:4px;flex-wrap:wrap}
.jump a{font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px}
.jump a:hover{background:var(--surface);color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;scroll-margin-top:90px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:24px}
.eyebrow{font:600 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 14px}
.grid .wide{grid-column:span 2}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.f input.big{font:600 22px var(--f-display);letter-spacing:.01em}
.unit{position:relative}
.unit input{padding-right:44px;font-family:var(--f-num)}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.check{display:flex;align-items:center;gap:10px;min-height:46px;font-weight:500}
.check input{width:24px;height:24px;accent-color:var(--accent)}
.contact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.tb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tb .grp{display:flex;gap:4px;align-items:center;padding-right:6px;margin-right:2px;border-right:1px solid var(--line)}
.tb .grp:last-child{border-right:0}
.tool{min-width:46px;min-height:46px;border-radius:10px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;font-weight:600;font-size:14px}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tool svg{width:22px;height:22px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface-2);padding:8px 12px;font-size:14px;font-weight:600;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sheetbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.sheetbar input{flex:1 1 220px;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--surface-2);font-weight:600}
.cwrap{position:relative;display:flex;justify-content:center;align-items:center}
.cstage{position:relative;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line),0 2px 14px rgba(0,0,0,.12);border-radius:4px;touch-action:none;flex:none}
#cv{position:absolute;left:0;top:0;display:block;background:#fff;touch-action:none;transform-origin:0 0}
.zoom{display:flex;align-items:center;gap:2px}
.zoom .tool{min-width:40px;font-size:20px}
.zoom #zReset{font:600 13px var(--f-num);min-width:58px}
#drawSec{padding:14px}
#edFull{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 2px}
.strip button{flex:none;width:120px;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:0;overflow:hidden;text-align:left}
.strip button[aria-current="true"]{border-color:var(--accent)}
.strip img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#fff}
.strip span{display:block;font-size:12px;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .add{display:flex;align-items:center;justify-content:center;min-height:118px;font-weight:600;color:var(--accent);border-style:dashed;text-align:center}
.selbar{position:absolute;z-index:2;display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);transform:translate(-50%,calc(-100% - 14px));white-space:nowrap}
.selbar .btn{min-height:40px}
.bubble{position:absolute;left:50%;top:24px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:min(440px,calc(100% - 32px));flex-wrap:wrap;z-index:3}
.bubble.padmode{width:min(360px,calc(100% - 20px));top:12px;padding:12px}
.bubble.padmode > .btn{flex:1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.pad button{min-height:58px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font:500 26px var(--f-num);color:var(--ink);touch-action:manipulation}
.pad button:active{background:var(--accent-soft)}
.pad .del{font-size:22px}
.units{display:flex;width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.units button{flex:1;border:0;background:var(--surface-2);min-height:44px;font-weight:600;color:var(--muted)}
.units button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.padlbl{width:100%;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bubble input{flex:1 1 180px;min-height:48px;font:500 20px var(--f-num);padding:0 12px;border:2px solid var(--accent);border-radius:8px;background:var(--surface-2)}
#drawSec.full{position:fixed;inset:0;z-index:50;border-radius:0;display:flex;flex-direction:column;overflow:auto;
  padding:calc(6px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#drawSec.full .cwrap{flex:1;min-height:0}
#drawSec.full .sheetbar, #drawSec.full .strip, #drawSec.full .card-h{display:none}
/* Barre d'outils compacte (icônes) : le maximum de place pour la feuille */
#drawSec .tb{margin-bottom:6px;gap:2px}
#drawSec.full .tb{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#drawSec.full .tb::-webkit-scrollbar{display:none}
#drawSec .tb .grp{padding-right:4px;margin-right:0;gap:2px;flex:none}
#drawSec .tool{min-width:40px;min-height:40px;padding:0 7px}
#drawSec .tool span{display:none}
#drawSec #pencilOnly span{display:inline;font-size:13px}
#drawSec .tool svg{width:21px;height:21px}
#drawSec .sw{width:26px;height:26px;border-width:2px}
#drawSec .seg button{min-height:34px;padding:4px 8px;font-size:13px}
#drawSec .zoom .tool{min-width:34px}
#drawSec .zoom #zReset{min-width:50px;font-size:12px}
#drawSec #edFullLbl{display:inline;font-size:13px}
#drawSec.full #edFullLbl{display:none}
#drawSec .tb{margin-bottom:8px}

.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.tile{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.tile img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface-2);cursor:zoom-in}
.tile .doc{aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--surface-2);padding:10px;text-align:center}
.tile .ext{font:600 20px var(--f-num);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:8px 12px}
.tile .doc b{font-size:14px;word-break:break-word;font-weight:600}
.tile input{border:0;border-top:1px solid var(--line);padding:9px 10px;background:transparent;min-height:42px;font-size:14px;width:100%}
.tile .acts{display:flex;gap:4px;padding:6px;border-top:1px solid var(--line)}
.tile .acts .btn{flex:1}
.tile .tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:6px 10px 0}

textarea.notes{min-height:200px;font-size:17px;line-height:1.55;resize:vertical}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:8px 14px;font-size:14px;min-height:40px}

.pans{width:100%;border-collapse:collapse}
.pans-wrap{overflow-x:auto;margin:0 -4px}
.pans th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:0 6px 6px}
.pans td{padding:4px 6px;vertical-align:middle}
.pans input{width:100%;min-width:84px;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-family:var(--f-num)}
.pans td.name input{font-family:var(--f-body);min-width:110px}
.pans td.out{font-family:var(--f-num);text-align:right;white-space:nowrap}
.sub-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.sub-h h4{margin:0;font:600 20px var(--f-display)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;font-weight:500;background:var(--surface-2);cursor:pointer}
.ck:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.ck input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.f.full{grid-column:1/-1}
.cp-ville{display:grid;grid-template-columns:minmax(90px,.8fr) 2fr;gap:10px}
.typepick{display:flex;gap:10px;flex-wrap:wrap}
.typepick label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:46px;font-weight:600}
.typepick input{width:22px;height:22px;accent-color:var(--accent)}
.totals{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.tot{flex:1 1 150px;background:var(--surface-2);border-radius:10px;padding:10px 14px;border-left:4px solid var(--tape)}
.tot .v{font:500 22px var(--f-num)}

<script>
(() => {
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const num = v => { const x = parseFloat(String(v ?? '').replace(/\s/g,'').replace(',','.')); return isFinite(x) ? x : 0; };
const fmt = (x, d=2) => x.toLocaleString('fr-FR', {minimumFractionDigits:d, maximumFractionDigits:d});
const size = b => b > 1048576 ? fmt(b/1048576,1)+' Mo' : Math.max(1,Math.round(b/1024))+' Ko';
const inFrame = (() => { try { return window.self !== window.top; } catch { return true; } })();
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }
function armed(btn, label, action){
  if(btn.classList.contains('armed')){ action(); return; }
  const old = btn.textContent; btn.classList.add('armed'); btn.textContent = label;
  setTimeout(() => { if(btn.isConnected){ btn.classList.remove('armed'); btn.textContent = old; } }, 3500);
}

/* ---------- Stockage local (IndexedDB, repli en mémoire) ---------- */
const DB = {
  db:null, mem:{chantiers:new Map(), media:new Map(), outbox:new Map()},
  async open(){
    try{
      this.db = await new Promise((res,rej)=>{
        const r = indexedDB.open('releves-chantier', 2);
        r.onupgradeneeded = () => { const d=r.result;
          for(const st of ['chantiers','media','outbox']) if(!d.objectStoreNames.contains(st)) d.createObjectStore(st,{keyPath:'id'}); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    }catch{ this.db = null; }
    try{ navigator.storage?.persist?.(); }catch{}
  },
  rq(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async all(st){ if(!this.db) return [...this.mem[st].values()]; return this.rq(this.db.transaction(st).objectStore(st).getAll()); },
  async get(st,id){ if(!this.db) return this.mem[st].get(id); return this.rq(this.db.transaction(st).objectStore(st).get(id)); },
  async rawPut(st,v){ if(!this.db){ this.mem[st].set(v.id,v); return; } const tx=this.db.transaction(st,'readwrite'); tx.objectStore(st).put(v); return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error);}); },
  async rawDel(st,id){ if(!this.db){ this.mem[st].delete(id); return; } const tx=this.db.transaction(st,'readwrite'); tx.objectStore(st).delete(id); return new Promise(res=>{tx.oncomplete=res;tx.onerror=res;}); },
  /* Toute modification sur la tablette est mise en file d'envoi vers le serveur */
  async put(st,v){ if(SYNC.role==='viewer') return; await this.rawPut(st,v); Sync.queue(st, v, 'put'); },
  async del(st,id){ if(SYNC.role==='viewer') return; const v = st==='media' ? await this.get(st,id) : byId(id); await this.rawDel(st,id); Sync.queue(st, v||{id}, 'del'); }
};

/* ---------- Synchronisation : tablette → serveur → Mac/PC en consultation ---------- */
const SYNC = {role:'tablette', token:'', base:'api/releves', last:0, state:'off', busy:false, pending:0, timer:null};
try{ SYNC.role = localStorage.getItem('rc-role') || 'tablette'; SYNC.token = localStorage.getItem('rc-token') || ''; SYNC.last = +localStorage.getItem('rc-last') || 0; }catch{}
const Sync = {
  async api(method, path, body){
    const r = await fetch(SYNC.base + path, {method, cache:'no-store', headers:{'x-releves-token':SYNC.token, ...(body?{'content-type':'application/json'}:{})}, body: body?JSON.stringify(body):undefined});
    if(r.status===401) throw Object.assign(new Error('Code d’accès refusé par le serveur'), {auth:true});
    if(!r.ok){ let m='Erreur serveur ('+r.status+')'; try{ m=(await r.json()).error||m; }catch{} throw new Error(m); }
    return r.json();
  },
  isExample(st, v){ return st==='chantiers' ? !!v.exemple : !!byId(v.chantierId)?.exemple; },
  async queue(st, v, op){
    if(SYNC.role!=='tablette' || st==='outbox' || !v || this.isExample(st, v)) return;
    await DB.rawPut('outbox', {id:st+':'+v.id, st, rid:v.id, op, t:Date.now()+Math.random()});
    this.schedule(1500);
  },
  schedule(ms){ clearTimeout(SYNC.timer); SYNC.timer = setTimeout(()=>this.flush(), ms); this.refreshStatus(); },
  async flush(){
    if(SYNC.role!=='tablette' || !SYNC.token || SYNC.busy) return this.refreshStatus();
    if(!navigator.onLine){ SYNC.state='offline'; return this.refreshStatus(); }
    SYNC.busy=true; SYNC.state='sync'; this.refreshStatus();
    try{
      const items = (await DB.all('outbox')).sort((a,b)=>(a.st==='chantiers'?0:1)-(b.st==='chantiers'?0:1) || a.t-b.t);
      for(const it of items){
        const route = it.st==='chantiers' ? '/chantiers/' : '/media/';
        if(it.op==='put'){ const v = await DB.get(it.st, it.rid); if(v) await this.api('PUT', route+encodeURIComponent(it.rid), v); }
        else await this.api('DELETE', route+encodeURIComponent(it.rid));
        const now = await DB.get('outbox', it.id);
        if(now && now.t===it.t) await DB.rawDel('outbox', it.id);   // ne retire pas une modification arrivée pendant l'envoi
      }
      SYNC.last=Date.now(); try{ localStorage.setItem('rc-last', SYNC.last); }catch{}
      SYNC.state='ok';
      if((await DB.all('outbox')).length) this.schedule(500);
    }catch(e){ SYNC.state = e.auth ? 'auth' : 'err'; SYNC.error = e.message; this.schedule(60000); }
    finally{ SYNC.busy=false; this.refreshStatus(); }
  },
  async pushAll(){
    for(const c of await DB.all('chantiers')) if(!c.exemple) await DB.rawPut('outbox', {id:'chantiers:'+c.id, st:'chantiers', rid:c.id, op:'put', t:Date.now()+Math.random()});
    const ex = new Set(S.list.filter(c=>c.exemple).map(c=>c.id));
    for(const m of await DB.all('media')) if(!ex.has(m.chantierId)) await DB.rawPut('outbox', {id:'media:'+m.id, st:'media', rid:m.id, op:'put', t:Date.now()+Math.random()});
    this.flush();
  },
  async refreshStatus(){
    const dot=$('#syncDot'), txt=$('#syncTxt'); if(!dot) return;
    const hhmm = SYNC.last ? new Date(SYNC.last).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '';
    let cls='', t='Synchronisation non configurée';
    if(SYNC.token){
      if(SYNC.role==='viewer'){
        if(SYNC.state==='ok'){ cls='ok'; t='Consultation · à jour '+hhmm; }
        else if(SYNC.state==='auth'){ cls='err'; t='Code d’accès refusé'; }
        else if(SYNC.state==='err'){ cls='err'; t='Serveur injoignable'; }
        else t='Consultation';
      } else {
        const n = (await DB.all('outbox')).length;
        if(SYNC.state==='auth'){ cls='err'; t='Code d’accès refusé'; }
        else if(SYNC.state==='sync'){ cls='wait'; t='Envoi en cours…'; }
        else if(n){ cls='wait'; t = `${n} modification${n>1?'s':''} à envoyer` + (SYNC.state==='offline'?' (hors ligne)':SYNC.state==='err'?' (serveur injoignable)':''); }
        else { cls='ok'; t = 'Tout est envoyé' + (hhmm?' · '+hhmm:''); }
      }
    }
    dot.className='syncdot '+cls; txt.textContent=t;
  }
};
window.addEventListener('online', () => Sync.flush());
function openSettings(){
  const d=$('#settings'); d.hidden=false;
  $$('input[name=role]', d).forEach(r => r.checked = r.value===SYNC.role);
  $('#setToken').value = SYNC.token; $('#setMsg').textContent = SYNC.error && SYNC.state!=='ok' ? SYNC.error : '';
  $('#setPushAll').hidden = SYNC.role!=='tablette';
}
$('#syncBtn').onclick = openSettings;
$('#setCancel').onclick = () => $('#settings').hidden = true;
$('#settings').onclick = e => { if(e.target.id==='settings') $('#settings').hidden=true; };
$('#setTest').onclick = async () => {
  const keep=SYNC.token; SYNC.token=$('#setToken').value.trim(); $('#setMsg').textContent='Test en cours…';
  try{ const r=await Sync.api('GET','/status'); $('#setMsg').textContent=`Connexion réussie : ${r.chantiers} dossier(s) et ${r.media} photo(s)/croquis sur le serveur.`; }
  catch(e){ $('#setMsg').textContent = e.auth ? 'Le serveur refuse ce code.' : 'Serveur injoignable depuis cet appareil. L’appli doit être ouverte depuis son adresse sur le Raspberry.'; }
  SYNC.token=keep;
};
$('#setPushAll').onclick = async () => { await Sync.pushAll(); $('#setMsg').textContent='Tous les dossiers sont en file d’envoi.'; };
$('#setSave').onclick = async () => {
  const role = $('input[name=role]:checked')?.value || 'tablette', token = $('#setToken').value.trim();
  const changedRole = role!==SYNC.role;
  SYNC.role=role; SYNC.token=token; SYNC.state='off';
  try{ localStorage.setItem('rc-role',role); localStorage.setItem('rc-token',token); }catch{}
  $('#settings').hidden=true;
  if(changedRole){ await flushDrawing(true); S.cur=null; S.media=[]; E.m=null; S.list=[]; await load(); }
  else if(role==='viewer') await loadRemote(true);
  else { if(token && !SYNC.last) await Sync.pushAll(); else Sync.flush(); }
  toast(role==='viewer' ? 'Mode consultation' : 'Réglages enregistrés');
};
setInterval(() => { if(SYNC.role==='tablette') Sync.flush(); }, 120000);

/* ---------- Modèle ---------- */
const STATUTS = {chiffrer:'À chiffrer', devis:'Devis envoyé', signe:'Signé', perdu:'Sans suite'};
const blankToiture = () => ({mode:'rampant', pans:[{nom:'Pan 1',longueur:'',largeur:'',pente:''}], lineaires:{}, existante:'', etat:'', charpente:'', ondulit:false, isolation:'', acces:''});
const blankPortail = () => ({type:'', largeur:'', hauteur:'', hPiliers:'', sectionPiliers:'', refoulement:'', sens:'', pente:'', remplissage:'', ral:'', motorisation:'', cloture:'', portillon:''});
const newChantier = () => ({id:uid(), client:'', nom:'', prenom:'', tel:'', email:'', adresse:'', cp:'', ville:'', date:new Date().toISOString().slice(0,10), statut:'chiffrer',
  types:[], toiture:blankToiture(), portail:blankPortail(), notes:'', geo:null, created:Date.now(), updated:Date.now()});
/* Nom affiché, adresse complète, valeurs à cases multiples */
const fullName = c => c.client || [c.nom, c.prenom].filter(Boolean).join(' ');
const fullAdr = c => [c.adresse, [c.cp, c.ville].filter(Boolean).join(' ')].filter(Boolean).join(', ');
const listVal = v => Array.isArray(v) ? v.join(', ') : (v || '');
function normalize(c){
  if(c.nom===undefined){ c.nom = c.client || ''; c.prenom = ''; }
  c.prenom ??= ''; c.cp ??= ''; c.ville ??= '';
  const t = c.toiture || {};
  for(const k of ['existante','etat','charpente','isolation']) if(t[k] && !Array.isArray(t[k])) t[k] = [t[k]];
  if(t.ondulit === true && !t.produit) t.produit = ['Ondulit'];
  if(Array.isArray(t.produit)) t.produit = t.produit.map(x => x==='Covrib' ? 'Coverib' : x);
  const p = c.portail || {};
  for(const k of ['type','sens','remplissage']) if(p[k] && !Array.isArray(p[k])) p[k] = [p[k]];
  return c;
}
const LINEAIRES = [['faitage','Faîtage'],['rives','Rives'],['egouts','Égouts / gouttières'],['noues','Noues'],['aretiers','Arêtiers'],['brizi','Brizi (bavettes de raccord)'],['solins','Solins'],['closoirs','Closoirs']];
const toitureTotals = t => {
  let surf = 0;
  const pans = (t.pans||[]).map(p => {
    const L=num(p.longueur), l=num(p.largeur), pente=num(p.pente);
    const ramp = t.mode==='plat' ? L/Math.cos(Math.atan(pente/100)) : L;
    const s = ramp*l; surf += s;
    return {ramp, s, deg: Math.atan(pente/100)*180/Math.PI};
  });
  return {surf, pans, lin: LINEAIRES.reduce((a,[k]) => a + num(t.lineaires?.[k]), 0)};
};

/* ---------- Pavé numérique pour les cases de chiffres (iPad) ---------- */
const TOUCH = window.matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 1;
const NP = {el:null, v:''};
(() => {
  const keys = ['7','8','9','4','5','6','1','2','3',',','0','del'];
  $('#npKeys').innerHTML = keys.map(k => `<button type="button" data-k="${k}" ${k==='del'?'class="del" aria-label="Effacer le dernier chiffre"':''}>${k==='del'?'⌫':k}</button>`).join('');
})();
const fmtTel = d => d.replace(/\D/g,'').slice(0,10).replace(/(\d{4})(\d{0,2})(\d{0,2})(\d{0,2})/, (m,a,b,c,e)=>[a,b,c,e].filter(Boolean).join(' '));
function npShow(){
  const el=NP.el, kind=el.dataset.pad;
  $('#npLbl').textContent = el.dataset.label || '';
  const shown = kind==='tel' ? fmtTel(NP.v) : NP.v;
  $('#npVal').innerHTML = `${esc(shown) || '<span style="color:var(--muted)">0</span>'}${el.dataset.unit?` <small>${esc(el.dataset.unit)}</small>`:''}`;
  $('#npKeys [data-k=","]').disabled = kind!=='dec';
}
function npOpen(el){
  if(SYNC.role==='viewer') return;
  npClose(true);
  NP.el = el; NP.v = el.dataset.pad==='tel' ? el.value.replace(/\D/g,'') : el.value.replace('.', ',');
  el.classList.add('padfocus'); npShow(); $('#numpad').hidden = false; NP.t = Date.now();
  // garder la case visible au-dessus du pavé
  const scroller = el.closest('#main, #clientPane');
  const pad = $('#numpad').getBoundingClientRect(), r = el.getBoundingClientRect();
  if(scroller && r.bottom > pad.top - 12) scroller.scrollBy({top: r.bottom - pad.top + 24, behavior:'smooth'});
}
function npCommit(){
  const el=NP.el; if(!el) return;
  const kind=el.dataset.pad, v = kind==='tel' ? fmtTel(NP.v) : NP.v.replace(/,$/,'');
  if(el.value !== v){ el.value = v; el.dispatchEvent(new Event('input', {bubbles:true})); }
}
function npClose(commit){ if(NP.el){ if(commit) npCommit(); NP.el.classList.remove('padfocus'); } NP.el=null; $('#numpad').hidden = true; }
$('#npKeys').addEventListener('click', e => {
  const b=e.target.closest('[data-k]'); if(!b || !NP.el || Date.now() - NP.t < 400) return;   // ignore le « clic » du même appui qui a ouvert le pavé
  const k=b.dataset.k, kind=NP.el.dataset.pad, max = kind==='cp' ? 5 : kind==='tel' ? 10 : 8;
  if(k==='del') NP.v = NP.v.slice(0,-1);
  else if(k===','){ if(!NP.v.includes(',')) NP.v = (NP.v||'0') + ','; }
  else if(NP.v.replace(/\D/g,'').length < max) NP.v = (kind==='dec' && NP.v==='0' ? '' : NP.v) + k;
  npShow(); npCommit();
});
$('#npClear').onclick = () => { if(Date.now()-NP.t<400) return; NP.v=''; npShow(); npCommit(); };
$('#npOk').onclick = () => { if(Date.now()-NP.t<400) return; npClose(true); };
document.addEventListener('pointerdown', e => {
  const el = e.target.closest?.('input[data-pad]');
  if(el && TOUCH){ e.preventDefault(); npOpen(el); return; }
  if(NP.el && !e.target.closest('#numpad')) npClose(true);
}, true);
/* iPad : toutes les cases de texte sont verrouillées tant qu'on ne les touche pas.
   L'écriture manuscrite du Pencil (Griffonner) ne peut donc jamais démarrer dedans ;
   un appui (doigt ou Pencil) déverrouille la case et ouvre le clavier. */
const KB_SEL = 'input[type=text]:not([data-pad]):not(#bubbleIn), input[type=email], input[type=search], input[type=password], input:not([type]), textarea';
function kbLock(root){
  if(!TOUCH || SYNC.role==='viewer') return;
  const list = root.matches?.(KB_SEL) ? [root] : [...(root.querySelectorAll?.(KB_SEL) || [])];
  for(const el of list){ if(el.dataset.kb || el.readOnly || el === document.activeElement) continue; el.dataset.kb = '1'; el.readOnly = true; }
}
new MutationObserver(ms => { for(const m of ms) for(const n of m.addedNodes) if(n.nodeType===1) kbLock(n); })
  .observe(document.body, {childList:true, subtree:true});
kbLock(document.body);
/* L'iPad n'affiche le clavier que si la case reçoit le focus pendant le « tap » (événement click) et n'est
   pas verrouillée à ce moment-là : on empêche donc le focus automatique (mousedown), puis au click on
   déverrouille et on donne le focus nous-mêmes. */
document.addEventListener('mousedown', e => {
  const el = e.target.closest?.('[data-kb]');
  if(el && document.activeElement !== el) e.preventDefault();
}, true);
document.addEventListener('click', e => {
  const el = e.target.closest?.('[data-kb]'); if(!el || SYNC.role==='viewer') return;
  el.readOnly = false;
  if(document.activeElement === el && el.dataset.kbOpen) return;   // déjà en saisie : laisser placer le curseur
  if(document.activeElement === el) el.blur();
  el.focus();
  el.dataset.kbOpen = '1';
  try{ const n = el.value.length; el.setSelectionRange(n, n); }catch{}
}, true);
document.addEventListener('focusout', e => {
  const el=e.target; if(!el.dataset?.kb || SYNC.role==='viewer') return;
  delete el.dataset.kbOpen; el.readOnly = true;
}, true);

const get = (o,p) => p.split('.').reduce((a,k)=>a?.[k], o);
const set = (o,p,v) => { const ks=p.split('.'); const last=ks.pop(); ks.reduce((a,k)=>a[k]??=({}), o)[last]=v; };
function field(path, label, opt={}){
  const v = get(S.cur, path) ?? '';
  const id = 'f_'+path.replace(/\./g,'_');
  const cls = opt.wide ? ' wide' : '';
  if(opt.options) return `<div class="f${cls}"><label for="${id}">${label}</label><select id="${id}" data-path="${path}">
    ${opt.noBlank?'':'<option value="">—</option>'}${opt.options.map(o=>{ const [val,lab] = Array.isArray(o)?o:[o,o]; return `<option value="${esc(val)}" ${val===v?'selected':''}>${esc(lab)}</option>`; }).join('')}</select></div>`;
  if(opt.checks){
    const arr = Array.isArray(v) ? v : (v ? [v] : []);
    return `<div class="f full"><span class="lbl">${label}</span><div class="checks">${opt.checks.map(o=>
      `<label class="ck"><input type="checkbox" data-multi="${path}" value="${esc(o)}" ${arr.includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div></div>`;
  }
  if(opt.check) return `<label class="check${cls}"><input type="checkbox" id="${id}" data-path="${path}" ${v?'checked':''}>${label}</label>`;
  const padKind = opt.unit ? 'dec' : opt.num ? 'cp' : opt.type==='tel' ? 'tel' : '';
  const inp = `<input id="${id}" data-path="${path}" value="${esc(v)}" type="${opt.type||'text'}" ${padKind?`data-pad="${padKind}" data-unit="${opt.unit||''}" data-label="${esc(label)}"${TOUCH?' readonly':''}`:''} ${opt.unit?'inputmode="decimal"':opt.num?'inputmode="numeric" maxlength="5"':''} ${opt.big?'class="big"':''} placeholder="${esc(opt.ph||'')}" autocomplete="off">`;
  return `<div class="f${cls}"><label for="${id}">${label}</label>${opt.unit?`<div class="unit">${inp}<span>${opt.unit}</span></div>`:inp}</div>`;
}

    const k = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);

  } finally { URL.revokeObjectURL(url); }
}
async function addFile(file){

    try{ const r = await shrink(file); const m = {...base, kind:'photo', base:r.data, data:r.data, w:r.w, h:r.h, ops:[]};
      await DB.put('media', m); S.media.push(m); touch(); toast('Photo ajoutée'); return; }catch{}
  }
  if(file.size > 40*1048576){ toast(`« ${file.name} » dépasse 40 Mo`); return; }

    const m = {...base, kind:'fichier', name:file.name, mime:file.type||'application/octet-stream', size:file.size, data:await readURL(file)};

}

      E.cur = {t:'pen', c:E.color, w:E.w, pts:[[...p, e.pointerType==='pen'?e.pressure:0.5]]};
    }
    paint();
  });
  cv.addEventListener('pointermove', e => {
    if(G.on || e.pointerId!==active || !st) return;
    if(!st.moved && Math.hypot(e.clientX-st.down[0], e.clientY-st.down[1]) > 8) st.moved=true;
    if(!st.moved) return;
    const p = pt(e);
    if(st.mode==='draw'){
      if(E.cur.t==='pen'){ for(const ev of (e.getCoalescedEvents?.()||[e])) E.cur.pts.push([...pt(ev), ev.pointerType==='pen'?ev.pressure:0.5]); }
      else E.cur.b = snapEnd(E.cur.a, p);
      paint();
    } else if(st.mode==='vertex'){
      const q = snapEnd(st.fixed, p, st.excl);
      E.ops = st.base.map((o,i)=>{ const ends=st.owners.filter(w=>w.i===i); if(!ends.length) return o; const n={...o}; ends.forEach(w=>{ n[w.end]=q.slice(); }); return n; });
      commit();
    } else if(st.mode==='pan'){
      const V=st.V, dp=DPR();
      setView(V.s, V.ox - (e.clientX-st.down[0])*dp/V.s, V.oy - (e.clientY-st.down[1])*dp/V.s);
    } else if(st.mode==='move'){
      const d=[p[0]-st.from[0], p[1]-st.from[1]];
      E.ops = st.base.map((o,i)=> i===st.i ? tr(o,d) : o);
      commit();
    }
  });
  const end = e => {
    if(e.pointerId!==active) return; active=null;
    const s0=st; st=null; E.guide=null; E.match=null; if(!s0) return;
    if(s0.mode==='pan') return;
    if(s0.mode==='draw'){
      const o=E.cur; E.cur=null; if(!o) return;
      if(o.t==='pen'){ pushOps([...E.ops, o]); return; }
      if(!s0.moved && o.t==='cote'){ paint(); coteTap(pt(e)); return; }
      if(!s0.moved){                      // simple appui : sélectionne le trait touché
        const i = s0.fromVertex ? s0.fromVertex.owners[0].i : hit(pt(e));
        setSel(i>=0 && E.ops[i].a ? i : null); return;
      }
      if(dist(o.a,o.b) < 12*curK()){ paint(); return; }
      if(o.t==='cote'){ E.cur=o; paint(); askText('Valeur de la cote', txt => { E.cur=null; pushOps([...E.ops, {...o, txt}]); }, () => { E.cur=null; paint(); }, '', true); return; }
      if(o.t==='line') o.id=uid();
      pushOps([...E.ops, o]);
      return;
    }
    if(s0.moved){ const next=E.ops; E.undo.push(s0.base); E.redo=[]; E.ops=next; changed(); }
    else paint();
    positionSelbar();
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}

let padOn=false, padUnit='mm';
try{ const u=localStorage.getItem('rc-unit'); if(u!==null) padUnit=u; }catch{}
function syncUnits(){ $$('#units [data-u]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.u===padUnit)); }
function padKey(k){
  const i=$('#bubbleIn'); let v=i.value;
  if(k==='del') v=v.slice(0,-1);
  else if(k===','){ if(!/[,]/.test(v)) v=(v||'0')+','; }
  else if(v.replace(/\D/g,'').length<7) v = (v==='0' ? '' : v) + k;
  i.value=v;
}
function askText(ph, ok, no, v='', pad=false){
  const b=$('#bubble'), i=$('#bubbleIn');
  padOn=pad; bubbleOk=ok; bubbleNo=no;
  b.classList.toggle('padmode', pad); $('#pad').hidden=!pad; $('#units').hidden=!pad; $('#padLbl').hidden=!pad;
  i.readOnly=pad; i.setAttribute('inputmode', pad?'none':'text');
  if(pad){ const m=String(v).trim().match(/^([\d.,]*)\s*(mm|cm|m)?$/); if(m){ v=m[1].replace('.',','); if(m[2]) padUnit=m[2]; else if(String(v)) padUnit=''; } syncUnits(); }
  i.placeholder=pad?'0':ph; i.value=v; b.hidden=false;
  if(!pad) setTimeout(()=>i.focus(),30);
}
document.addEventListener('keydown', e => {
  if(!padOn || $('#bubble')?.hidden) return;
  if(/^[0-9]$/.test(e.key)){ padKey(e.key); e.preventDefault(); }
  else if(e.key===','||e.key==='.'){ padKey(','); e.preventDefault(); }
  else if(e.key==='Backspace'){ padKey('del'); e.preventDefault(); }
  else if(e.key==='Enter'){ $('#bubble').requestSubmit(); e.preventDefault(); }
  else if(e.key==='Escape'){ $('#bubbleCancel').click(); }
});
